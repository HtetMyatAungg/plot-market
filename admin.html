<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store nominations · Plot Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
<main class="admin-shell">
  <header class="admin-head">
    <div>
      <h1>Store nominations</h1>
      <p class="admin-subtitle">Review public storefronts nominated by shoppers.</p>
    </div>
    <form class="admin-token" id="admin-token-form">
      <label for="admin-token">Admin token</label>
      <input id="admin-token" type="password" autocomplete="current-password" placeholder="Optional unless configured">
      <button class="btn small" type="submit">Refresh</button>
    </form>
  </header>
  <p id="admin-message" class="admin-message" role="status"></p>
  <section id="admin-list" class="admin-list" aria-live="polite"></section>
</main>
<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
